{id:'acc_cash',name:'Dompet Tunai',type:'cash',provider:'Tunai',openingBalance:0,openingDate:todayISO(),notes:'Uang fisik yang dibawa',active:true},
{id:'acc_bank',name:'Rekening Utama',type:'bank',provider:'Bank',openingBalance:0,openingDate:todayISO(),notes:'Rekening utama',active:true},
{id:'acc_dana',name:'DANA',type:'ewallet',provider:'DANA',openingBalance:0,openingDate:todayISO(),notes:'E-wallet',active:true},
{id:'acc_gopay',name:'GoPay',type:'ewallet',provider:'GoPay',openingBalance:0,openingDate:todayISO(),notes:'E-wallet',active:true},
{id:'acc_savings',name:'Tabungan',type:'savings',provider:'Tabungan',openingBalance:0,openingDate:todayISO(),notes:'Simpanan',active:true}],transactions:[],categories:[...EXPENSE_CATS,...INCOME_CATS],budgets:[],goals:[],liabilities:[]}}
let state;try{const saved=localStorage.getItem(KEY);state=saved?JSON.parse(saved):initialState()}catch(e){state=initialState()}
if(!state.categories)state.categories=[...EXPENSE_CATS,...INCOME_CATS];if(!state.liabilities)state.liabilities=[];if(!state.goals)state.goals=[];if(!state.budgets)state.budgets=[];if(!state.accounts)state.accounts=[];if(!state.transactions)state.transactions=[];if(!state.settings)state.settings={currency:'IDR',weekStart:1,hideAmounts:false,profileName:'Keuangan gue'};
let page='dashboard',filters={search:'',type:'all',account:'all',category:'all',month:monthISO()},reportOffset=0,editingTx=null,selectedTxType='expense',editingAccount=null,editingGoal=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));if(!suppressCloudQueue){const now=new Date().toISOString();localStorage.setItem(LOCAL_UPDATED_KEY,now);scheduleCloudSync()}return true}catch(e){toast('Penyimpanan gagal. Ekspor backup dan periksa ruang penyimpanan HP.');return false}}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${safe(msg)}</div>`;setTimeout(()=>root.innerHTML='',3000)}
function readCloudConfig(){try{return {...DEFAULT_CLOUD_CONFIG,...JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'{}')}}catch(e){return {...DEFAULT_CLOUD_CONFIG}}}
function cloudConfigured(){const c=readCloudConfig();return !!(c.url&&c.key)}
function initCloudClient(){const c=readCloudConfig();if(!c.url||!c.key){cloudClient=null;cloudStatusText='Belum dikonfigurasi';return false}if(!window.supabase||!window.supabase.createClient){cloudStatusText='Library cloud belum termuat. Periksa koneksi internet.';return false}try{if(!cloudClient||cloudClient.__arusUrl!==c.url||cloudClient.__arusKey!==c.key){cloudClient=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});cloudClient.__arusUrl=c.url;cloudClient.__arusKey=c.key}return true}catch(e){cloudStatusText='Konfigurasi URL atau publishable key tidak valid';return false}}
function hasMeaningfulLocalData(){return state.transactions.length>0||state.accounts.some(a=>(Number(a.openingBalance)||0)!==0)||state.budgets.length>0||state.goals.length>0||state.liabilities.length>0||state.categories.some(c=>!c.system)}
function normalizeState(data){const base=initialState();return {...base,...data,settings:{...base.settings,...(data?.settings||{})},accounts:Array.isArray(data?.accounts)?data.accounts:base.accounts,transactions:Array.isArray(data?.transactions)?data.transactions:[],categories:Array.isArray(data?.categories)?data.categories:[...EXPENSE_CATS,...INCOME_CATS],budgets:Array.isArray(data?.budgets)?data.budgets:[],goals:Array.isArray(data?.goals)?data.goals:[],liabilities:Array.isArray(data?.liabilities)?data.liabilities:[]}}
function updateCloudStatus(msg,rerender=false){cloudStatusText=msg;const el=document.getElementById('cloudStatusText');if(el)el.textContent=msg;const who=document.getElementById('cloudWho');if(who)who.textContent=cloudUser?.email||'Belum login';const signIn=document.getElementById('cloudSignIn');const signOut=document.getElementById('cloudSignOut');const syncBtns=document.getElementById('cloudActions');if(signIn)signIn.style.display=cloudUser?'none':'inline-flex';if(signOut)signOut.style.display=cloudUser?'inline-flex':'none';if(syncBtns)syncBtns.style.display=cloudUser?'flex':'none';if(rerender&&page==='settings')render()}
async function fetchCloudRecord(){if(!cloudClient||!cloudUser)throw new Error('Belum login ke cloud.');const {data,error}=await cloudClient.from('arus_user_data').select('data,updated_at').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;return data}
async function pushCloudRecord(showToast=true,calledFromReconcile=false){if(!cloudClient||!cloudUser)throw new Error('Sebelum sinkron, login ke akun cloud ARUS.');const lockAlreadyHeld=cloudBusy;if(lockAlreadyHeld&&!calledFromReconcile)return;if(!lockAlreadyHeld)cloudBusy=true;updateCloudStatus('Mengirim data ke cloud…');try{const stamp=new Date().toISOString();const {data,error}=await cloudClient.from('arus_user_data').upsert({user_id:cloudUser.id,data:state,updated_at:stamp},{onConflict:'user_id'}).select('updated_at').single();if(error)throw error;const syncedAt=data?.updated_at||stamp;localStorage.setItem(LOCAL_UPDATED_KEY,syncedAt);localStorage.setItem(LAST_SYNC_KEY,syncedAt);cloudReady=true;updateCloudStatus('Tersinkron · '+new Date(syncedAt).toLocaleString('id-ID'));if(showToast)toast('Data ARUS berhasil disinkronkan ke cloud.')}catch(e){cloudReady=false;updateCloudStatus('Gagal sinkron: '+(e.message||'periksa konfigurasi'));if(showToast)toast('Sinkronisasi gagal. Data lokal tetap tersimpan. Periksa tabel dan kebijakan RLS.');console.error('ARUS cloud push error',e)}finally{if(!lockAlreadyHeld)cloudBusy=false}}
function applyCloudRecord(record,showToast=true){if(!record?.data)throw new Error('Data cloud kosong.');suppressCloudQueue=true;state=normalizeState(record.data);localStorage.setItem(KEY,JSON.stringify(state));const stamp=record.updated_at||new Date().toISOString();localStorage.setItem(LOCAL_UPDATED_KEY,stamp);localStorage.setItem(LAST_SYNC_KEY,stamp);suppressCloudQueue=false;cloudReady=true;updateCloudStatus('Tersinkron · '+new Date(stamp).toLocaleString('id-ID'));render();if(showToast)toast('Data cloud berhasil dimuat ke perangkat ini.')}
async function pullCloudRecord(showToast=true){const record=await fetchCloudRecord();if(!record){updateCloudStatus('Belum ada data cloud');return false}applyCloudRecord(record,showToast);return true}
async function reconcileCloud(source='manual'){if(!cloudClient||!cloudUser)return;cloudBusy=true;cloudReady=false;updateCloudStatus('Memeriksa data cloud…');try{const remote=await fetchCloudRecord();const localAt=localStorage.getItem(LOCAL_UPDATED_KEY);const lastSync=localStorage.getItem(LAST_SYNC_KEY);const localHas=hasMeaningfulLocalData();if(!remote){await pushCloudRecord(false,true);return}if(!lastSync){if(!localHas){applyCloudRecord(remote,false);updateCloudStatus('Tersinkron · data cloud dimuat');return}const goCloud=confirm('Data cloud sudah ada, dan perangkat ini juga berisi data lokal. Tekan OK untuk MENGGANTI data lokal dengan data cloud. Tekan Batal untuk menghentikan sinkron otomatis sementara; gunakan tombol Upload lokal atau Download cloud secara manual setelahnya. Buat backup lokal dulu jika perlu.');if(goCloud){applyCloudRecord(remote,false);return}updateCloudStatus('Login aktif · pilih sinkron manual');return}const localChanged=!!localAt&&Date.parse(localAt)>Date.parse(lastSync)+1000;const remoteChanged=Date.parse(remote.updated_at)>Date.parse(lastSync)+1000;if(localChanged&&remoteChanged){const chooseCloud=confirm('Ada perubahan lokal dan cloud sejak sinkron terakhir. Tekan OK untuk MENGGANTI data lokal dengan versi cloud. Tekan Batal untuk mempertahankan dan mengunggah versi lokal ke cloud. Pastikan keputusan lo benar.');if(chooseCloud){applyCloudRecord(remote,false);return}else{await pushCloudRecord(false,true);return}}if(localChanged){await pushCloudRecord(false,true);return}applyCloudRecord(remote,false)}catch(e){cloudReady=false;updateCloudStatus('Belum tersinkron: '+(e.message||'periksa koneksi'));toast('Cloud belum tersinkron. Data lokal tetap tersedia. Periksa URL, key, tabel, dan RLS.');console.error('ARUS cloud reconcile error',e)}finally{cloudBusy=false;updateCloudStatus(cloudStatusText,page==='settings')}}
function scheduleCloudSync(){if(!cloudUser||!cloudReady||suppressCloudQueue)return;if(cloudTimer)clearTimeout(cloudTimer);updateCloudStatus('Ada perubahan · menunggu sinkron…');cloudTimer=setTimeout(()=>{if(!navigator.onLine){updateCloudStatus('Offline · perubahan disimpan lokal');return}pushCloudRecord(false)},1200)}
async function startupCloud(){if(!cloudConfigured())return;const ok=initCloudClient();if(!ok){updateCloudStatus(cloudStatusText);return}try{cloudStatusText='Memeriksa sesi login…';const {data,error}=await cloudClient.auth.getSession();if(error)throw error;cloudUser=data.session?.user||null;if(cloudUser){await reconcileCloud('startup')}else updateCloudStatus('Konfigurasi tersimpan · belum login');if(page==='settings')render()}catch(e){updateCloudStatus('Cloud belum siap: '+(e.message||'cek koneksi'))}}
async function saveCloudConfiguration(){const url=(document.getElementById('supabaseUrl')?.value||'').trim().replace(/\/$/,'');const key=(document.getElementById('supabaseKey')?.value||'').trim();if(!url||!key){toast('Isi Project URL dan publishable key dulu.');return}try{const parsed=new URL(url);if(parsed.protocol!=='https:'||!parsed.hostname.endsWith('.supabase.co'))throw new Error('Gunakan Project URL HTTPS dari Supabase.');localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify({url,key}));cloudClient=null;cloudUser=null;cloudReady=false;if(!initCloudClient())throw new Error(cloudStatusText);cloudStatusText='Konfigurasi tersimpan · silakan login';updateCloudStatus(cloudStatusText,true);toast('Konfigurasi Supabase tersimpan di perangkat ini.')}catch(e){toast('Konfigurasi belum valid: '+e.message)}}
async function cloudSignIn(){if(!initCloudClient()){toast('Simpan Project URL dan publishable key terlebih dahulu.');return}const email=(document.getElementById('cloudEmail')?.value||'').trim();const password=document.getElementById('cloudPassword')?.value||'';if(!email||!password){toast('Masukkan email dan password akun Supabase yang dibuat di dashboard.');return}updateCloudStatus('Login…');try{const {data,error}=await cloudClient.auth.signInWithPassword({email,password});if(error)throw error;cloudUser=data.user;document.getElementById('cloudPassword').value='';updateCloudStatus('Login berhasil · menyiapkan sinkron…');await reconcileCloud('login');if(page==='settings')render()}catch(e){cloudUser=null;cloudReady=false;updateCloudStatus('Login gagal: '+e.message,true);toast('Login gagal. Periksa email/password dan konfigurasi Supabase.')}}
async function cloudSignOut(){if(cloudClient){const {error}=await cloudClient.auth.signOut();if(error){toast('Gagal logout: '+error.message);return}}cloudUser=null;cloudReady=false;updateCloudStatus('Logout · data lokal tetap ada',true);toast('Logout cloud berhasil. Data lokal tidak dihapus.')}
async function manualCloudDownload(){if(!cloudUser)return;try{const r=await fetchCloudRecord();if(!r){toast('Belum ada data cloud untuk diunduh.');return}if(!confirm('Download dari cloud akan MENGGANTI data lokal di HP ini. Buat backup lokal dulu bila perlu. Lanjutkan?'))return;applyCloudRecord(r,true)}catch(e){toast('Gagal mengambil data cloud: '+e.message)}}
async function manualCloudUpload(){if(!cloudUser)return;if(!confirm('Upload lokal akan MENGGANTI salinan cloud dengan data di HP ini. Pastikan ini memang versi yang ingin dipakai. Lanjutkan?'))return;await pushCloudRecord(true)}
function handleCloudError(err){updateCloudStatus('Gagal: '+(err?.message||'kesalahan tak diketahui'));toast('Operasi cloud gagal. Data lokal tetap tersimpan.');console.error(err)}

function amount(n){return state.settings.hideAmounts?'••••••':rupiah(n)}
function accountBy(id){return state.accounts.find(a=>a.id===id)}
function catBy(id){return state.categories.find(c=>c.id===id)}
function txImpact(tx,accountId){if(tx.type==='income')return tx.accountId===accountId?tx.amount:0;if(tx.type==='expense')return tx.accountId===accountId?-tx.amount:0;if(tx.type==='transfer')return (tx.fromAccountId===accountId?-tx.amount:0)+(tx.toAccountId===accountId?tx.amount:0);return 0}
function accountBalance(a,until=null){let bal=Number(a.openingBalance)||0;for(const t of state.transactions){if(until&&t.date>until)continue;if(t.type==='transfer'){const from=accountBy(t.fromAccountId),to=accountBy(t.toAccountId);const start=[from?.openingDate,to?.openingDate].filter(Boolean).sort().at(-1)||'0000-00-00';if(t.date>=start)bal+=txImpact(t,a.id)}else if(t.date>=a.openingDate)bal+=txImpact(t,a.id)}return num(bal)}
function allAssets(){return num(state.accounts.filter(a=>a.active).reduce((s,a)=>s+accountBalance(a),0))}
function allTx({from=null,to=null,type=null,account=null,category=null}={}){return state.transactions.filter(t=>(!from||t.date>=from)&&(!to||t.date<=to)&&(!type||type==='all'||t.type===type)&&(!category||category==='all'||t.categoryId===category)&&(!account||account==='all'||(t.accountId===account||t.fromAccountId===account||t.toAccountId===account))).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))}
function totals(txs){let income=0,expense=0,transfers=0;for(const t of txs){if(t.type==='income')income+=t.amount;else if(t.type==='expense')expense+=t.amount;else transfers+=t.amount}return {income:num(income),expense:num(expense),net:num(income-expense),transfers:num(transfers),count:txs.length}}
function monthStart(m){return `${m}-01`}
function monthEnd(m){let [y,mo]=m.split('-').map(Number);return `${y}-${String(new Date(y,mo,0).getDate()).padStart(2,'0')}`}
function currentMonthTx(m=monthISO()){return allTx({from:monthStart(m),to:monthEnd(m)})}
function getWeek(offset=0){const d=new Date();const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow+offset*7);d.setHours(12,0,0,0);let start=new Date(d);let end=new Date(d);end.setDate(end.getDate()+6);const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;return {from:iso(start),to:iso(end),label:`${start.toLocaleDateString('id-ID',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}`}}
function expenseByCategory(txs){const m={};txs.filter(t=>t.type==='expense').forEach(t=>{const c=catBy(t.categoryId);const id=t.categoryId||'uncat';m[id]=(m[id]||{id,name:c?.name||'Tanpa kategori',icon:c?.icon||'📦',value:0,count:0});m[id].value+=t.amount;m[id].count++});return Object.values(m).sort((a,b)=>b.value-a.value)}
function accountSubtitle(a){return `${ACCOUNT_TYPES[a.type]?.label||'Akun lain'}${a.provider?' · '+a.provider:''}`}
function txAccountLabel(t){if(t.type==='transfer')return `${accountBy(t.fromAccountId)?.name||'Akun dihapus'} → ${accountBy(t.toAccountId)?.name||'Akun dihapus'}`;return accountBy(t.accountId)?.name||'Akun dihapus'}
function txTitle(t){if(t.type==='transfer')return 'Transfer antar-akun';const c=catBy(t.categoryId);return t.party||c?.name||'Transaksi'}
function txIcon(t){if(t.type==='transfer')return '⇄';return catBy(t.categoryId)?.icon||(t.type==='income'?'↗':'↘')}
function empty(msg='Belum ada data',detail='Mulai catat transaksi untuk melihat ringkasan di sini.'){return `<div class="empty"><b>${safe(msg)}</b>${safe(detail)}</div>`}
function pageHeading(title,subtitle,action=''){return `<div class="page-head"><div><h2>${title}</h2><p>${subtitle}</p></div>${action}</div>`}
function kpi(label,value,icon,foot,kind=''){return `<div class="kpi"><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon}</span></div><div class="kpi-value ${kind}">${amount(value)}</div><div class="kpi-foot">${foot}</div></div>`}
function txRow(t){const sign=t.type==='income'?'+':t.type==='expense'?'−':'';const kind=t.type==='income'?'positive':t.type==='expense'?'negative':'';const typeLabel={income:'Pemasukan',expense:'Pengeluaran',transfer:'Transfer'}[t.type];return `<div class="tx-row"><div class="tx-icon">${txIcon(t)}</div><div class="tx-main"><b>${safe(txTitle(t))}</b><small>${dateFmt(t.date)} · ${safe(txAccountLabel(t))}${t.note?' · '+safe(t.note):''}</small></div><div class="tx-value ${kind}">${sign}${amount(t.amount)}<small>${typeLabel}</small></div></div>`}
function accountRow(a){return `<div class="account-row"><div class="account-icon">${ACCOUNT_TYPES[a.type]?.icon||'💰'}</div><div class="account-info"><b>${safe(a.name)}</b><span>${safe(accountSubtitle(a))}</span></div><div class="account-balance">${amount(accountBalance(a))}<small>saldo saat ini</small></div></div>`}
function spendChart(txs,days=7){const d=[];const end=dateObj(todayISO());for(let i=days-1;i>=0;i--){let x=new Date(end);x.setDate(x.getDate()-i);let iso=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;const dayTx=txs.filter(t=>t.date===iso);d.push({label:x.toLocaleDateString('id-ID',{weekday:'short'}),income:dayTx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),expense:dayTx.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0)})}let max=Math.max(1,...d.flatMap(x=>[x.income,x.expense]));return `<div class="chart">${d.map(x=>`<div class="bar-group"><div class="bars"><i class="bar income" title="Pemasukan ${rupiah(x.income)}" style="height:${Math.max(x.income?3:0,x.income/max*100)}%"></i><i class="bar expense" title="Pengeluaran ${rupiah(x.expense)}" style="height:${Math.max(x.expense?3:0,x.expense/max*100)}%"></i></div><span class="bar-label">${x.label}</span></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#39bd86"></i>Pemasukan</span><span><i class="dot" style="background:#eb7985"></i>Pengeluaran</span></div>`}
function budgetRows(month=monthISO(),limit=4){const budgets=state.budgets.filter(b=>b.month===month).map(b=>({...b,cat:catBy(b.categoryId),spent:allTx({from:monthStart(month),to:monthEnd(month),type:'expense',category:b.categoryId}).reduce((s,t)=>s+t.amount,0)})).sort((a,b)=>b.spent/Math.max(1,b.limit)-a.spent/Math.max(1,a.limit));return budgets.slice(0,limit).map(b=>{let p=b.limit?b.spent/b.limit*100:0;return `<div class="budget-row"><div class="budget-top"><b>${b.cat?.icon||'📦'} ${safe(b.cat?.name||'Kategori dihapus')}</b><span>${Math.round(p)}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,p)}%;background:${p>=100?'#d94b59':p>=75?'#e4a33e':'#4a79e2'}"></div></div><div class="budget-bottom"><span>${amount(b.spent)} terpakai</span><span>dari ${amount(b.limit)}</span></div></div>`}).join('')||empty('Belum ada anggaran','Atur limit bulanan untuk kategori pengeluaran yang ingin dikendalikan.')}
function renderDashboard(){const m=monthISO(),mt=totals(currentMonthTx(m)),wk=getWeek(0),wt=totals(allTx({from:wk.from,to:wk.to})),recent=allTx().slice(0,5),accounts=state.accounts.filter(a=>a.active),cats=expenseByCategory(currentMonthTx(m)).slice(0,5);return `${pageHeading('Keuangan lo, lebih terkontrol.','Ringkasan saldo, arus kas, dan kebiasaan pengeluaran lo.',`<button class="primary" data-action="add-tx">＋ Catat transaksi</button>`)}
<div class="kpis">${kpi('Total saldo semua akun',allAssets(),'◈',`${accounts.length} akun aktif`)}${kpi('Pemasukan bulan ini',mt.income,'↗',monthFmt(m),'positive')}${kpi('Pengeluaran bulan ini',mt.expense,'↘',monthFmt(m),'negative')}${kpi('Arus kas bulan ini',mt.net,mt.net>=0?'⇧':'⇩',`${mt.count} transaksi bulan ini`,mt.net>=0?'positive':'negative')}</div>
<div class="grid-two"><section class="panel"><div class="panel-head"><div><h3>Arus kas 7 hari terakhir</h3><p>Perbandingan pemasukan dan pengeluaran per hari</p></div><button class="text-btn" data-page="reports">Lihat laporan →</button></div>${spendChart(allTx({from:getWeek(0).from,to:todayISO()}),7)}</section><section class="panel"><div class="panel-head"><div><h3>Saldo per akun</h3><p>Uang lo tersebar di mana saja</p></div><button class="text-btn" data-page="accounts">Semua akun →</button></div><div class="account-list">${accounts.slice(0,5).map(accountRow).join('')||empty('Belum ada akun','Tambahkan dompet, rekening, atau e-wallet terlebih dahulu.')}</div></section></div>
<div class="grid-two"><section class="panel"><div class="panel-head"><div><h3>Transaksi terbaru</h3><p>Aktivitas keuangan terakhir</p></div><button class="text-btn" data-page="transactions">Lihat semua →</button></div><div class="transaction-list">${recent.map(txRow).join('')||empty('Belum ada transaksi','Catat transaksi pertama lo supaya dashboard mulai terisi.')}</div></section><section class="panel"><div class="panel-head"><div><h3>Anggaran bulan ini</h3><p>${monthFmt(m)}</p></div><button class="text-btn" data-page="budgets">Kelola →</button></div>${budgetRows(m,4)}<div class="panel-head" style="margin-top:23px;margin-bottom:12px"><div><h3>Pengeluaran terbesar</h3><p>Berdasarkan kategori bulan ini</p></div></div>${cats.length?cats.map((c,i)=>`<div class="category-bar-row"><span class="cat-name">${c.icon} ${safe(c.name)}</span><div class="progress-track"><div class="progress-fill" style="width:${Math.max(2,c.value/Math.max(...cats.map(x=>x.value))*100)}%;background:${['#4169e1','#39ad80','#e4a33e','#8c6bd1','#de7887'][i%5]}"></div></div><span class="cat-num">${amount(c.value)}</span></div>`).join(''):empty('Belum ada pengeluaran')}</section></div>

function renderTransactions(){const txs=allTx({type:filters.type,account:filters.account,category:filters.category,from:filters.month==='all'?null:monthStart(filters.month),to:filters.month==='all'?null:monthEnd(filters.month)}).filter(t=>{const s=filters.search.toLowerCase();return !s||[txTitle(t),t.note,t.party,txAccountLabel(t),catBy(t.categoryId)?.name].some(v=>String(v||'').toLowerCase().includes(s))});const rows=txs.map(t=>`<tr><td>${dateFmt(t.date)}<br><span class="muted">${safe(t.time||'')}</span></td><td><b>${safe(txTitle(t))}</b>${t.note?`<br><span class="muted">${safe(t.note)}</span>`:''}</td><td>${safe(txAccountLabel(t))}</td><td><span class="tag ${t.type}">${{income:'Pemasukan',expense:'Pengeluaran',transfer:'Transfer'}[t.type]}</span></td><td>${safe(t.type==='transfer'?'Transfer':catBy(t.categoryId)?.name||'Tanpa kategori')}</td><td class="${t.type==='income'?'positive':t.type==='expense'?'negative':''}" style="font-weight:800">${t.type==='income'?'+':t.type==='expense'?'−':''}${amount(t.amount)}</td><td><button class="secondary" data-edit-tx="${t.id}">Edit</button> <button class="danger" data-delete-tx="${t.id}">Hapus</button></td></tr>`).join('');return `${pageHeading('Semua transaksi','Satu buku besar untuk seluruh pemasukan, pengeluaran, dan transfer.',`<button class="primary" data-action="add-tx">＋ Tambah transaksi</button>`)}<section class="panel"><div class="filters"><input class="field search" id="txSearch" placeholder="Cari keterangan, kategori, atau akun…" value="${safe(filters.search)}"><select class="select" id="txType"><option value="all">Semua jenis</option><option value="income" ${filters.type==='income'?'selected':''}>Pemasukan</option><option value="expense" ${filters.type==='expense'?'selected':''}>Pengeluaran</option><option value="transfer" ${filters.type==='transfer'?'selected':''}>Transfer</option></select><select class="select" id="txAccount"><option value="all">Semua akun</option>${state.accounts.map(a=>`<option value="${a.id}" ${filters.account===a.id?'selected':''}>${safe(a.name)}</option>`).join('')}</select><select class="select" id="txMonth"><option value="all" ${filters.month==='all'?'selected':''}>Semua tanggal</option>${Array.from({length:18},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const m=monthISO(d);return `<option value="${m}" ${filters.month===m?'selected':''}>${monthFmt(m)}</option>`}).join('')}</select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Tanggal</th><th>Deskripsi</th><th>Akun / perpindahan</th><th>Jenis</th><th>Kategori</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${rows||`<tr><td colspan="7">${empty('Transaksi tidak ditemukan','Coba ubah filter atau tambahkan transaksi baru.')}</td></tr>`}</tbody></table></div><div class="small-note" style="margin-top:14px">${txs.length} transaksi ditampilkan. Transfer antar-akun memengaruhi saldo masing-masing akun, tetapi bukan pemasukan atau pengeluaran total.</div></section>`}
function renderAccounts(){const active=state.accounts.filter(a=>a.active),groups=Object.keys(ACCOUNT_TYPES).map(type=>({type,items:active.filter(a=>a.type===type)})).filter(g=>g.items.length);return `${pageHeading('Akun & saldo','Pantau uang secara terpisah: dompet fisik, rekening bank, e-wallet, tabungan, dan investasi.',`<button class="primary" data-action="add-account">＋ Tambah akun</button>`)}<div class="kpis">${kpi('Total seluruh akun',allAssets(),'◈','Jumlah saldo semua akun aktif')}${kpi('Tunai',active.filter(a=>a.type==='cash').reduce((s,a)=>s+accountBalance(a),0),'👛','Uang fisik di dompet')}${kpi('E-wallet',active.filter(a=>a.type==='ewallet').reduce((s,a)=>s+accountBalance(a),0),'📱','Gabungan semua e-wallet')}${kpi('Bank & tabungan',active.filter(a=>['bank','savings','deposit'].includes(a.type)).reduce((s,a)=>s+accountBalance(a),0),'🏦','Rekening, tabungan, deposito')}</div><div class="notice"><strong>Mulai dengan saldo aktual.</strong> Isi saldo awal sesuai jumlah uang yang benar-benar ada di setiap akun. Saldo awal adalah titik mulai pencatatan, bukan pemasukan baru. Catat transaksi sejak tanggal saldo awal agar saldo akhir tetap akurat.</div>${groups.map(g=>`<div style="margin-bottom:25px"><div class="panel-head" style="margin-bottom:12px"><div><h3>${ACCOUNT_TYPES[g.type].icon} ${ACCOUNT_TYPES[g.type].label}</h3><p>${g.items.length} akun · total ${amount(g.items.reduce((s,a)=>s+accountBalance(a),0))}</p></div></div><div class="section-grid">${g.items.map(a=>`<article class="account-card"><div class="acc-head"><div class="account-icon">${ACCOUNT_TYPES[a.type].icon}</div><div><div class="acc-name">${safe(a.name)}</div><div class="acc-type">${safe(a.provider||ACCOUNT_TYPES[a.type].label)}</div></div></div><div class="acc-balance">${amount(accountBalance(a))}</div><div class="acc-caption">Saldo per saat ini · saldo awal ${amount(a.openingBalance)}</div><div class="acc-actions"><button class="secondary" data-edit-account="${a.id}">Edit akun</button><button class="secondary" data-transfer-account="${a.id}">Transfer</button></div><div class="small-note" style="margin-top:10px">Mulai pencatatan: ${dateFmt(a.openingDate)}</div></article>`).join('')}</div></div>`).join('')}<section class="panel"><div class="panel-head"><div><h3>Ringkasan saldo per akun</h3><p>Urut berdasarkan nama akun</p></div><button class="text-btn" data-export="csv">Ekspor transaksi CSV →</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Nama akun</th><th>Jenis</th><th>Penyedia</th><th>Saldo awal</th><th>Saldo saat ini</th><th>Mulai pencatatan</th></tr></thead><tbody>${active.map(a=>`<tr><td><b>${safe(a.name)}</b></td><td>${safe(ACCOUNT_TYPES[a.type].label)}</td><td>${safe(a.provider||'—')}</td><td>${amount(a.openingBalance)}</td><td style="font-weight:800">${amount(accountBalance(a))}</td><td>${dateFmt(a.openingDate)}</td></tr>`).join('')}</tbody></table></div></section>`}
function renderBudgets(){const month=filters.month==='all'?monthISO():filters.month;const rows=state.budgets.filter(b=>b.month===month).map(b=>({...b,cat:catBy(b.categoryId),spent:allTx({from:monthStart(month),to:monthEnd(month),type:'expense',category:b.categoryId}).reduce((s,t)=>s+t.amount,0)})).sort((a,b)=>b.spent/Math.max(b.limit,1)-a.spent/Math.max(a.limit,1));const totalLimit=rows.reduce((s,b)=>s+b.limit,0),totalSpent=rows.reduce((s,b)=>s+b.spent,0);return `${pageHeading('Anggaran','Tetapkan batas pengeluaran agar uang punya arah, bukan cuma tercatat.',`<button class="primary" data-action="add-budget">＋ Atur anggaran</button>`)}<div class="filters"><select class="select month-input" id="budgetMonth">${Array.from({length:18},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const m=monthISO(d);return `<option value="${m}" ${month===m?'selected':''}>${monthFmt(m)}</option>`}).join('')}</select></div><div class="kpis">${kpi('Total limit',totalLimit,'◴',monthFmt(month))}${kpi('Sudah terpakai',totalSpent,'↘',`${totalLimit?Math.round(totalSpent/totalLimit*100):0}% dari total limit`,'negative')}${kpi('Sisa anggaran',totalLimit-totalSpent,'◎','Limit dikurangi pengeluaran',(totalLimit-totalSpent)<0?'negative':'positive')}${kpi('Kategori dianggarkan',rows.length,'▦','Kategori dengan limit aktif')}</div><section class="panel"><div class="panel-head"><div><h3>Kontrol anggaran per kategori</h3><p>Pengeluaran aktual dibanding batas yang lo tentukan</p></div></div>${rows.length?rows.map(b=>{const p=b.limit?b.spent/b.limit*100:0;return `<div class="budget-row" style="padding:13px 0;border-bottom:1px solid #f0f2f6"><div class="budget-top"><b>${b.cat?.icon||'📦'} ${safe(b.cat?.name||'Kategori tidak tersedia')}</b><span class="${p>=100?'negative':p>=75?'':'positive'}">${Math.round(p)}% digunakan</span></div><div class="progress-track" style="height:10px;margin-top:10px"><div class="progress-fill" style="width:${Math.min(100,p)}%;background:${p>=100?'#d94b59':p>=75?'#e4a33e':'#4169e1'}"></div></div><div class="budget-bottom"><span>Terpakai ${amount(b.spent)} · sisa ${amount(b.limit-b.spent)}</span><span>Limit ${amount(b.limit)}</span></div><div style="display:flex;justify-content:flex-end;margin-top:7px"><button class="secondary" data-edit-budget="${b.id}">Ubah limit</button> <button class="danger" data-delete-budget="${b.id}">Hapus</button></div></div>`}).join(''):empty('Belum ada anggaran untuk '+monthFmt(month),'Tambahkan anggaran per kategori untuk memantau batas pengeluaran bulanan.')}</section><p class="small-note" style="margin-top:12px">Kategori tanpa anggaran tetap tercatat normal. Limit anggaran tidak mengubah saldo dan bukan transaksi.</p>`}
function renderGoals(){const totalTarget=state.goals.reduce((s,g)=>s+g.target,0),totalSaved=state.goals.reduce((s,g)=>s+g.saved,0);return `${pageHeading('Target keuangan','Bikin tujuan finansial terukur dan pantau progresnya dari waktu ke waktu.',`<button class="primary" data-action="add-goal">＋ Target baru</button>`)}<div class="kpis">${kpi('Total target',totalTarget,'◎','Gabungan semua tujuan')}${kpi('Alokasi ke target',totalSaved,'🐷','Nominal yang lo tandai untuk tujuan')}${kpi('Kekurangan',Math.max(0,totalTarget-totalSaved),'🎯','Total target dikurangi alokasi')}${kpi('Target aktif',state.goals.length,'◷','Jumlah tujuan yang dicatat')}</div><div class="notice"><strong>Catatan:</strong> alokasi di halaman ini adalah penanda rencana, bukan saldo bank baru. Jangan menjumlahkan alokasi target lagi ke total saldo karena uangnya mungkin sudah tercakup dalam akun tabungan.</div><div class="section-grid">${state.goals.map(g=>{const p=g.target?g.saved/g.target*100:0;return `<article class="goal-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div class="account-icon">${safe(g.icon||'🎯')}</div><span class="tag">${p>=100?'Tercapai':Math.round(p)+'%'}</span></div><h3 style="font-size:15px;margin:14px 0 0">${safe(g.name)}</h3><div class="goal-amount">${amount(g.saved)} <span class="muted" style="font-size:11px;font-weight:500">/ ${amount(g.target)}</span></div><div class="progress-track" style="height:9px"><div class="progress-fill" style="width:${Math.min(100,p)}%;background:#39ad80"></div></div><div class="budget-bottom"><span>${amount(Math.max(0,g.target-g.saved))} lagi</span><span>${g.dueDate?'Target '+dateFmt(g.dueDate):'Tanpa tenggat'}</span></div>${g.note?`<p class="small-note">${safe(g.note)}</p>`:''}<div class="acc-actions"><button class="secondary" data-edit-goal="${g.id}">Edit</button><button class="danger" data-delete-goal="${g.id}">Hapus</button></div></article>`}).join('')||`<div class="panel" style="grid-column:1/-1">${empty('Belum ada target keuangan','Mulai dari dana darurat, gadget, liburan, atau tujuan pribadi lainnya.')}</div>`}</div>`}
function renderReports(){const wk=getWeek(reportOffset),prev=getWeek(reportOffset-1),txs=allTx({from:wk.from,to:wk.to}),prevTx=allTx({from:prev.from,to:prev.to}),t=totals(txs),pt=totals(prevTx),delta=t.expense-pt.expense,pct=pt.expense?delta/pt.expense*100:null;const dayData=Array.from({length:7},(_,i)=>{const d=dateObj(wk.from);d.setDate(d.getDate()+i);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const arr=txs.filter(x=>x.date===iso);return {label:d.toLocaleDateString('id-ID',{weekday:'short'}),income:arr.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),expense:arr.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)}});const max=Math.max(1,...dayData.flatMap(d=>[d.income,d.expense]));const cats=expenseByCategory(txs);const mt=totals(currentMonthTx()),monthCats=expenseByCategory(currentMonthTx());return `${pageHeading('Laporan & rekap','Lihat pola keuangan mingguan, bulanan, dan per kategori.','')}<section class="panel" style="margin-bottom:16px"><div class="panel-head" style="flex-wrap:wrap"><div><h3>Rekap mingguan</h3><p>Senin sampai Minggu · zona waktu perangkat</p></div><div class="week-switch"><button class="icon-btn" data-week="-1" aria-label="Minggu sebelumnya">‹</button><span class="week-label">${wk.label}</span><button class="icon-btn" data-week="1" aria-label="Minggu berikutnya" ${reportOffset>=0?'disabled':''}>›</button><button class="text-btn" data-week="0">Minggu ini</button></div></div><div class="report-grid"><div class="report-stat"><span>Total pemasukan</span><b class="positive">${amount(t.income)}</b></div><div class="report-stat"><span>Total pengeluaran</span><b class="negative">${amount(t.expense)}</b></div><div class="report-stat"><span>Arus kas bersih</span><b class="${t.net>=0?'positive':'negative'}">${amount(t.net)}</b></div><div class="report-stat"><span>Rata-rata pengeluaran / hari</span><b>${amount(t.expense/7)}</b></div><div class="report-stat"><span>Jumlah transaksi</span><b>${t.count}</b></div><div class="report-stat"><span>Transfer internal</span><b>${amount(t.transfers)}</b></div></div><div class="panel-head" style="margin-top:22px"><div><h3>Aktivitas per hari</h3><p>Perhatikan hari dengan pengeluaran tertinggi</p></div></div><div class="day-bars">${dayData.map(d=>`<div class="day-column"><div class="day-bars-pair"><i class="inc" title="Masuk ${rupiah(d.income)}" style="height:${Math.max(d.income?2:0,d.income/max*100)}%"></i><i class="exp" title="Keluar ${rupiah(d.expense)}" style="height:${Math.max(d.expense?2:0,d.expense/max*100)}%"></i></div><span>${d.label}</span></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#39bd86"></i>Pemasukan</span><span><i class="dot" style="background:#eb7985"></i>Pengeluaran</span></div><div style="margin-top:25px;padding-top:19px;border-top:1px solid var(--line)"><div class="panel-head"><div><h3>Dibanding minggu sebelumnya</h3><p>${prev.label}</p></div></div><div class="report-grid"><div class="report-stat"><span>Pengeluaran minggu lalu</span><b>${amount(pt.expense)}</b></div><div class="report-stat"><span>Selisih nominal</span><b class="${delta<=0?'positive':'negative'}">${delta>0?'+':''}${amount(delta)}</b></div><div class="report-stat"><span>Perubahan</span><b class="${delta<=0?'positive':'negative'}">${pct===null?(t.expense===0?'0%':'—'):((delta>0?'+':'')+pct.toLocaleString('id-ID',{maximumFractionDigits:1})+'%')}</b></div></div><p class="small-note">${pt.expense===0?(t.expense?'Minggu sebelumnya tidak memiliki pengeluaran tercatat; persentase perubahan tidak dihitung.':'Tidak ada pengeluaran tercatat pada kedua minggu.'):delta<0?`Pengeluaran turun ${amount(Math.abs(delta))} dibanding minggu sebelumnya.`:delta>0?`Pengeluaran naik ${amount(delta)} dibanding minggu sebelumnya.`:'Pengeluaran sama dengan minggu sebelumnya.'}</p></div></section><div class="grid-two"><section class="panel"><div class="panel-head"><div><h3>Pengeluaran per kategori</h3><p>Periode ${wk.label}</p></div></div>${cats.length?cats.map((c,i)=>`<div class="category-bar-row"><span class="cat-name">${c.icon} ${safe(c.name)}</span><div class="progress-track"><div class="progress-fill" style="width:${c.value/Math.max(...cats.map(x=>x.value))*100}%;background:${['#4169e1','#39ad80','#e4a33e','#8c6bd1','#de7887'][i%5]}"></div></div><span class="cat-num">${amount(c.value)}</span></div>`).join(''):empty('Belum ada pengeluaran pada minggu ini')}</section><section class="panel"><div class="panel-head"><div><h3>Ringkasan bulan berjalan</h3><p>${monthFmt(monthISO())}</p></div></div><div class="report-stat" style="margin-bottom:9px"><span>Pemasukan bulan ini</span><b class="positive">${amount(mt.income)}</b></div><div class="report-stat" style="margin-bottom:9px"><span>Pengeluaran bulan ini</span><b class="negative">${amount(mt.expense)}</b></div><div class="report-stat"><span>Arus kas bersih bulan ini</span><b class="${mt.net>=0?'positive':'negative'}">${amount(mt.net)}</b></div><div class="panel-head" style="margin:20px 0 12px"><div><h3>Pengeluaran bulanan teratas</h3><p>Top kategori bulan ini</p></div></div>${monthCats.slice(0,5).map(c=>`<div class="month-bar-row"><span>${c.icon} ${safe(c.name)}</span><div class="month-bar"><i style="width:${c.value/Math.max(1,...monthCats.map(x=>x.value))*100}%"></i></div><b style="text-align:right">${amount(c.value)}</b></div>`).join('')||empty('Belum ada data bulan ini')}</section></div>`}
function renderCloudPanel(){const cfg=readCloudConfig();return `<section class="panel" style="grid-column:1/-1"><div class="panel-head"><div><h3>☁️ Sinkronisasi cloud</h3><p>Pindahkan data ARUS ke HP baru menggunakan akun yang sama.</p></div><span class="tag" id="cloudStatusText">${safe(cloudStatusText)}</span></div><div class="notice"><strong>Data bersifat pribadi.</strong> URL dan publishable key boleh dipakai di aplikasi browser bila tabel memakai RLS. Jangan pernah menaruh database password, secret key, atau service_role key di sini. Buat backup JSON sebelum sinkronisasi pertama.</div><div class="form-grid"><div class="form-field"><label for="supabaseUrl">Project URL</label><input class="field" id="supabaseUrl" type="url" autocomplete="url" value="${safe(cfg.url||'')}" placeholder="https://xxxx.supabase.co"></div><div class="form-field"><label for="supabaseKey">Publishable key (atau legacy anon key)</label><input class="field" id="supabaseKey" type="password" autocomplete="off" value="${safe(cfg.key||'')}" placeholder="sb_publishable_…"></div></div><div class="setting-row"><div><b>Konfigurasi proyek</b><small>URL dan key disimpan di browser HP ini.</small></div><button class="secondary" id="saveCloudConfig">Simpan konfigurasi</button></div><div class="form-grid"><div class="form-field"><label for="cloudEmail">Email akun ARUS</label><input class="field" id="cloudEmail" type="email" autocomplete="username" placeholder="email lo yang terdaftar di Supabase"></div><div class="form-field"><label for="cloudPassword">Password akun ARUS</label><input class="field" id="cloudPassword" type="password" autocomplete="current-password" placeholder="Password akun Supabase"></div></div><div class="setting-row"><div><b>Akun cloud</b><small id="cloudWho">${safe(cloudUser?.email||'Belum login')}</small></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" id="cloudSignIn" ${cloudUser?'style="display:none"':''}>Login cloud</button><button class="secondary" id="cloudSignOut" ${cloudUser?'':'style="display:none"'}>Logout</button></div></div><div id="cloudActions" class="setting-row" style="${cloudUser?'display:flex':'display:none'};flex-wrap:wrap"><div><b>Kelola sinkronisasi</b><small>Sinkron otomatis setelah perubahan saat online.</small></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" id="cloudSyncNow">Sinkron sekarang</button><button class="secondary" id="cloudDownload">Download cloud</button><button class="secondary" id="cloudUpload">Upload lokal</button></div></div><p class="small-note">Persiapan sekali saja di Supabase: buat tabel ARUS lewat SQL Editor, lalu buat satu user di Authentication → Users. Data baru akan disimpan di cloud setelah login berhasil. Jika koneksi putus, ARUS tetap menyimpan perubahan lokal dan akan mencoba sinkron saat online.</p></section>`}
function renderSettings(){return `${pageHeading('Pengaturan & backup','Atur privasi, preferensi, serta keamanan data keuangan lo.','')}<div class="settings-grid">${renderCloudPanel()}<section class="panel"><div class="panel-head"><div><h3>Preferensi aplikasi</h3><p>Pengaturan tampilan dan pencatatan</p></div></div><div class="setting-row"><div><b>Sembunyikan nominal</b><small>Nominal disamarkan saat membuka aplikasi.</small></div><button class="secondary" id="toggleAmounts">${state.settings.hideAmounts?'Tampilkan':'Sembunyikan'}</button></div><div class="setting-row"><div><b>Nama ruang keuangan</b><small>Label pribadi yang tampil di aplikasi.</small></div><button class="secondary" data-action="profile">Ubah</button></div><div class="setting-row"><div><b>Kelola kategori</b><small>Tambah kategori pemasukan atau pengeluaran.</small></div><button class="secondary" data-action="add-category">Tambah kategori</button></div><div class="setting-row"><div><b>Ekspor transaksi CSV</b><small>Untuk Excel dan spreadsheet.</small></div><button class="secondary" data-export="csv">Ekspor CSV</button></div></section><section class="panel"><div class="panel-head"><div><h3>Backup & pemulihan</h3><p>Bagian paling penting untuk penggunaan jangka panjang</p></div></div><div class="notice"><strong>Data disimpan lokal dan dapat disinkronkan.</strong> Jika login cloud sudah aktif, perubahan akan dikirim ke Supabase saat online. File backup berisi detail keuangan; simpan secara privat.</div><div class="setting-row"><div><b>Backup seluruh data (JSON)</b><small>Akun, transaksi, kategori, anggaran, target, dan pengaturan.</small></div><button class="primary" data-export="json">Buat backup</button></div><div class="setting-row"><div><b>Pulihkan backup</b><small>Impor file backup ARUS yang sebelumnya dibuat.</small></div><button class="secondary" id="importBackup">Pilih file</button><input class="hidden" type="file" accept="application/json,.json" id="backupFile"></div><div class="setting-row"><div><b>Unduh ringkasan bulanan</b><small>Ekspor transaksi bulan berjalan sebagai CSV.</small></div><button class="secondary" data-export="monthcsv">Ekspor bulan ini</button></div></section><section class="panel"><div class="panel-head"><div><h3>Struktur data saat ini</h3><p>Ikhtisar item yang tersimpan pada perangkat ini</p></div></div><div class="report-grid"><div class="report-stat"><span>Akun aktif</span><b>${state.accounts.filter(a=>a.active).length}</b></div><div class="report-stat"><span>Total transaksi</span><b>${state.transactions.length}</b></div><div class="report-stat"><span>Kategori</span><b>${state.categories.length}</b></div><div class="report-stat"><span>Anggaran</span><b>${state.budgets.length}</b></div><div class="report-stat"><span>Target</span><b>${state.goals.length}</b></div><div class="report-stat"><span>Versi data</span><b>${state.version||1}</b></div></div><p class="small-note">Sumber penyimpanan: localStorage browser. Data terikat pada browser dan alamat situs ini. Jangan menghapus data situs sebelum membuat backup.</p></section><section class="panel"><div class="panel-head"><div><h3>Zona waktu & perhitungan</h3><p>Aturan dasar aplikasi</p></div></div><div class="setting-row"><div><b>Rekap mingguan</b><small>Senin–Minggu berdasarkan tanggal lokal perangkat.</small></div><span class="tag">ISO week</span></div><div class="setting-row"><div><b>Mata uang</b><small>Rupiah Indonesia (IDR).</small></div><span class="tag">IDR</span></div><div class="setting-row"><div><b>Transfer akun sendiri</b><small>Tidak dihitung sebagai pemasukan/pengeluaran.</small></div><span class="tag">Aktif</span></div><div class="setting-row"><div><b>Hapus semua data</b><small>Hanya gunakan jika ingin mulai dari nol. Ekspor backup terlebih dahulu.</small></div><button class="danger" id="resetAll">Reset data</button></div></section></div>`}
function render(){document.getElementById('todayPill').textContent=new Date().toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});const titles={dashboard:'Dashboard',transactions:'Semua transaksi',accounts:'Akun & saldo',budgets:'Anggaran',goals:'Target keuangan',reports:'Laporan & rekap',settings:'Pengaturan & backup'};document.getElementById('topTitle').textContent=titles[page]||'ARUS';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const fn={dashboard:renderDashboard,transactions:renderTransactions,accounts:renderAccounts,budgets:renderBudgets,goals:renderGoals,reports:renderReports,settings:renderSettings};document.getElementById('view').innerHTML=fn[page]();wireView()}
function showModal(title,subtitle,body,foot){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h3>${title}</h3><p>${subtitle||''}</p></div><button class="icon-btn" id="closeModal" aria-label="Tutup">×</button></div><form id="modalForm"><div class="modal-body">${body}</div><div class="modal-foot">${foot||'<button type="button" class="secondary" id="cancelModal">Batal</button><button class="primary" type="submit">Simpan</button>'}</div></form></section></div>`;document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal')?.addEventListener('click',closeModal);document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.querySelector('#modalForm input:not([type=hidden]),#modalForm select')?.focus()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function field(label,control,full=false,hint=''){return `<div class="form-field ${full?'full':''}"><label>${label}</label>${control}${hint?`<div class="hint">${hint}</div>`:''}</div>`}
function selectOptions(items,selected,placeholder){return `<option value="">${placeholder||'Pilih...'}</option>`+items.map(i=>`<option value="${i.value}" ${i.value===selected?'selected':''}>${safe(i.label)}</option>`).join('')}
function openTx(type='expense',tx=null,preAccount=null){editingTx=tx?.id||null;selectedTxType=tx?.type||type;const activeAccounts=state.accounts.filter(a=>a.active);const accountId=tx?.accountId||preAccount||activeAccounts[0]?.id||'';const fromId=tx?.fromAccountId||preAccount||activeAccounts[0]?.id||'';const toDefault=activeAccounts.find(a=>a.id!==fromId)?.id||'';const html=`<div class="form-field full"><label>Jenis transaksi</label><div class="radio-row"><button type="button" class="type-choice ${selectedTxType==='expense'?'chosen':''}" data-txtype="expense">↘ Pengeluaran</button><button type="button" class="type-choice ${selectedTxType==='income'?'chosen':''}" data-txtype="income">↗ Pemasukan</button><button type="button" class="type-choice ${selectedTxType==='transfer'?'chosen':''}" data-txtype="transfer">⇄ Transfer</button></div></div><div id="txDynamic" class="form-grid" style="margin-top:15px"></div>`;showModal(tx?'Edit transaksi':'Catat transaksi','Catat sesuai pergerakan uang yang benar-benar terjadi.',html);const paint=()=>{const categories=state.categories.filter(c=>c.type===selectedTxType);const amountVal=tx?.amount??'';let common=`${field('Nominal (Rupiah)',`<div class="amount-wrap"><span>Rp</span><input class="field" id="txAmount" type="number" inputmode="numeric" min="1" step="1" value="${amountVal}" placeholder="0" required></div>`,true)}${field('Tanggal',`<input class="field" type="date" id="txDate" value="${tx?.date||todayISO()}" required`)}${field('Waktu',`<input class="field" type="time" id="txTime" value="${tx?.time||new Date().toTimeString().slice(0,5)}">`)}`;let rest='';if(selectedTxType==='transfer'){rest=`${field('Dari akun',`<select class="field" id="txFrom" required>${selectOptions(activeAccounts.map(a=>({value:a.id,label:`${ACCOUNT_TYPES[a.type].icon} ${a.name}`})),tx?.fromAccountId||fromId,'Pilih akun asal')}</select>`)}${field('Ke akun',`<select class="field" id="txTo" required>${selectOptions(activeAccounts.map(a=>({value:a.id,label:`${ACCOUNT_TYPES[a.type].icon} ${a.name}`})),tx?.toAccountId||toDefault,'Pilih akun tujuan')}</select>`,false,'Transfer antar akun milik lo tidak dihitung sebagai pemasukan atau pengeluaran.')}`}else{rest=`${field('Akun',`<select class="field" id="txAccount" required>${selectOptions(activeAccounts.map(a=>({value:a.id,label:`${ACCOUNT_TYPES[a.type].icon} ${a.name}`})),accountId,'Pilih akun')}</select>`,false,'Pilih tempat uang masuk atau keluar.')}${field('Kategori',`<select class="field" id="txCategory" required>${selectOptions(categories.map(c=>({value:c.id,label:`${c.icon} ${c.name}`})),tx?.categoryId||categories[0]?.id,'Pilih kategori')}</select>`)}${field(selectedTxType==='income'?'Sumber pemasukan':'Merchant / tujuan pembayaran',`<input class="field" id="txParty" maxlength="100" value="${safe(tx?.party||'')}" placeholder="Contoh: kantor, warung, PLN">`)}${field('Catatan tambahan',`<input class="field" id="txNote" maxlength="250" value="${safe(tx?.note||'')}" placeholder="Opsional, misalnya makan siang bersama tim">`,true)}`};document.getElementById('txDynamic').innerHTML=common+rest;if(selectedTxType==='transfer'){const f=document.getElementById('txFrom'),to=document.getElementById('txTo');f.addEventListener('change',()=>{const old=to.value;to.innerHTML=selectOptions(activeAccounts.filter(a=>a.id!==f.value).map(a=>({value:a.id,label:`${ACCOUNT_TYPES[a.type].icon} ${a.name}`})),old===f.value?'':old,'Pilih akun tujuan')})}};document.querySelectorAll('[data-txtype]').forEach(b=>b.onclick=()=>{const oldAmount=document.getElementById('txAmount')?.value;const oldDate=document.getElementById('txDate')?.value;const oldTime=document.getElementById('txTime')?.value;selectedTxType=b.dataset.txtype;document.querySelectorAll('[data-txtype]').forEach(x=>x.classList.toggle('chosen',x===b));tx=null;paint();if(oldAmount!==undefined)document.getElementById('txAmount').value=oldAmount;if(oldDate)document.getElementById('txDate').value=oldDate;if(oldTime)document.getElementById('txTime').value=oldTime});paint();document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();const amt=num(document.getElementById('txAmount').value);if(!Number.isFinite(amt)||amt<=0){toast('Nominal harus lebih besar dari nol.');return}const date=document.getElementById('txDate').value;if(!date){toast('Tanggal wajib diisi.');return}let next={id:editingTx||uid(),type:selectedTxType,amount:amt,date,time:document.getElementById('txTime').value||'12:00',createdAt:tx?.createdAt||new Date().toISOString()};if(selectedTxType==='transfer'){next.fromAccountId=document.getElementById('txFrom').value;next.toAccountId=document.getElementById('txTo').value;if(!next.fromAccountId||!next.toAccountId||next.fromAccountId===next.toAccountId){toast('Pilih dua akun yang berbeda.');return}const fa=accountBy(next.fromAccountId),ta=accountBy(next.toAccountId);const transferStart=[fa?.openingDate,ta?.openingDate].filter(Boolean).sort().at(-1);if(transferStart&&date<transferStart&&!confirm(`Tanggal transfer lebih awal dari tanggal mulai saldo salah satu akun (${dateFmt(transferStart)}). Transfer ini akan tercatat di laporan, tetapi tidak mengubah saldo kedua akun. Tetap simpan?`))return;next.categoryId=null;next.party='';next.note='';}else{next.accountId=document.getElementById('txAccount').value;next.categoryId=document.getElementById('txCategory').value;next.party=document.getElementById('txParty').value.trim();next.note=document.getElementById('txNote').value.trim();if(!next.accountId||!next.categoryId){toast('Pilih akun dan kategori.');return}const acc=accountBy(next.accountId);if(acc&&date<acc.openingDate){if(!confirm(`Tanggal transaksi lebih awal dari tanggal mulai saldo akun (${dateFmt(acc.openingDate)}). Transaksi akan tercatat di laporan tetapi tidak memengaruhi saldo akun saat ini. Tetap simpan?`))return}}if(editingTx){state.transactions=state.transactions.filter(x=>x.id!==editingTx)}state.transactions.push(next);save();closeModal();render();toast(tx?'Transaksi berhasil diperbarui.':'Transaksi berhasil dicatat.')}}
function openAccount(a=null){editingAccount=a?.id||null;const types=Object.entries(ACCOUNT_TYPES).map(([value,v])=>({value,label:`${v.icon} ${v.label}`}));const html=`<div class="form-grid">${field('Nama akun',`<input class="field" id="accName" maxlength="70" required value="${safe(a?.name||'')}" placeholder="Contoh: BCA utama">`)}${field('Jenis akun',`<select class="field" id="accType" required>${selectOptions(types,a?.type||'bank','Pilih jenis akun')}</select>`)}${field('Nama bank / penyedia',`<input class="field" id="accProvider" maxlength="70" value="${safe(a?.provider||'')}" placeholder="Contoh: BCA, DANA, tunai">`)}${field('Saldo awal (Rp)',`<input class="field" id="accBalance" type="number" inputmode="numeric" step="1" required value="${a?.openingBalance??0}">`,false,'Isi saldo aktual pada tanggal mulai pencatatan. Nilai 0 diperbolehkan.')}${field('Tanggal mulai saldo',`<input class="field" id="accDate" type="date" required value="${a?.openingDate||todayISO()}">`,false,'Transaksi sebelum tanggal ini tidak memengaruhi saldo akun.')}${field('Catatan akun',`<input class="field" id="accNotes" maxlength="150" value="${safe(a?.notes||'')}" placeholder="Opsional">`,true)}</div>`;showModal(a?'Edit akun':'Tambah akun','Satu akun mewakili satu tempat uang disimpan.',html);document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('accName').value.trim();const type=document.getElementById('accType').value;const balance=Number(document.getElementById('accBalance').value);const date=document.getElementById('accDate').value;if(!name||!type||!Number.isFinite(balance)||!date){toast('Periksa lagi data akun.');return}if(state.accounts.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==editingAccount&&x.active)){toast('Nama akun tersebut sudah digunakan.');return}if(a){const hasTx=state.transactions.some(t=>t.accountId===a.id||t.fromAccountId===a.id||t.toAccountId===a.id);if(hasTx&&(num(a.openingBalance)!==num(balance)||a.openingDate!==date)&&!confirm('Akun ini sudah memiliki transaksi. Mengubah saldo awal atau tanggal mulai bisa mengubah saldo historis dan total saldo. Lanjutkan?'))return;a.name=name;a.type=type;a.provider=document.getElementById('accProvider').value.trim();a.openingBalance=num(balance);a.openingDate=date;a.notes=document.getElementById('accNotes').value.trim()}else state.accounts.push({id:uid(),name,type,provider:document.getElementById('accProvider').value.trim(),openingBalance:num(balance),openingDate:date,notes:document.getElementById('accNotes').value.trim(),active:true});save();closeModal();render();toast(a?'Akun diperbarui.':'Akun berhasil ditambahkan.')}}
function openBudget(b=null){const month=(b?.month)||monthISO();const used=state.budgets.filter(x=>x.month===month).map(x=>x.categoryId);const expenseCats=state.categories.filter(c=>c.type==='expense');const html=`<div class="form-grid">${field('Bulan anggaran',`<input class="field" type="month" id="budgetMonthForm" value="${month}" required>`)}${field('Kategori pengeluaran',`<select class="field" id="budgetCategory" required>${selectOptions(expenseCats.map(c=>({value:c.id,label:`${c.icon} ${c.name}`})),b?.categoryId||'','Pilih kategori')}</select>`)}${field('Batas anggaran (Rp)',`<input class="field" type="number" min="1" step="1" inputmode="numeric" id="budgetLimit" value="${b?.limit??''}" placeholder="1000000" required>`,true,'Batas ini digunakan untuk monitoring saja, tidak memindahkan uang.')}</div>`;showModal(b?'Ubah anggaran':'Atur anggaran','Tetapkan limit untuk satu kategori pada satu bulan.',html);document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();const m=document.getElementById('budgetMonthForm').value,c=document.getElementById('budgetCategory').value,l=num(document.getElementById('budgetLimit').value);if(!m||!c||l<=0){toast('Isi periode, kategori, dan limit yang valid.');return}const existing=state.budgets.find(x=>x.month===m&&x.categoryId===c);if(existing&&existing.id!==b?.id){existing.limit=l;toast('Anggaran kategori tersebut diperbarui.')}else if(b){b.month=m;b.categoryId=c;b.limit=l}else state.budgets.push({id:uid(),month:m,categoryId:c,limit:l});save();closeModal();render();toast('Anggaran disimpan.')}}
function openGoal(g=null){editingGoal=g?.id||null;const html=`<div class="form-grid">${field('Nama target',`<input class="field" id="goalName" maxlength="90" required value="${safe(g?.name||'')}" placeholder="Contoh: Dana darurat">`)}${field('Emoji / ikon',`<input class="field" id="goalIcon" maxlength="8" value="${safe(g?.icon||'🎯')}" placeholder="🎯">`)}${field('Nominal target (Rp)',`<input class="field" id="goalTarget" type="number" min="1" step="1" inputmode="numeric" required value="${g?.target??''}" placeholder="10000000">`)}${field('Nominal dialokasikan (Rp)',`<input class="field" id="goalSaved" type="number" min="0" step="1" inputmode="numeric" required value="${g?.saved??0}">`,false,'Nominal yang lo tandai untuk tujuan ini; bukan saldo terpisah.')}${field('Tanggal target (opsional)',`<input class="field" id="goalDue" type="date" value="${g?.dueDate||''}">`)}${field('Catatan',`<input class="field" id="goalNote" maxlength="180" value="${safe(g?.note||'')}" placeholder="Opsional">`,true)}</div>`;showModal(g?'Edit target':'Target keuangan baru','Buat tujuan finansial yang ingin lo capai.',html);document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('goalName').value.trim(),target=num(document.getElementById('goalTarget').value),saved=num(document.getElementById('goalSaved').value);if(!name||target<=0||saved<0){toast('Periksa nama dan nominal target.');return}const obj={id:editingGoal||uid(),name,icon:document.getElementById('goalIcon').value||'🎯',target,saved,dueDate:document.getElementById('goalDue').value,note:document.getElementById('goalNote').value.trim()};if(g)state.goals=state.goals.map(x=>x.id===g.id?obj:x);else state.goals.push(obj);save();closeModal();render();toast('Target disimpan.')}}
function openCategory(){const html=`<div class="form-grid">${field('Nama kategori',`<input class="field" id="catName" maxlength="50" required placeholder="Contoh: Kopi & nongkrong">`)}${field('Jenis kategori',`<select class="field" id="catType"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select>`)}${field('Ikon / emoji',`<input class="field" id="catIcon" maxlength="8" value="📦" placeholder="📦">`,true)}</div>`;showModal('Tambah kategori','Kategori kustom akan muncul saat mencatat transaksi.',html);document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('catName').value.trim(),type=document.getElementById('catType').value,icon=document.getElementById('catIcon').value||'📦';if(!name){toast('Nama kategori wajib diisi.');return}if(state.categories.some(c=>c.type===type&&c.name.toLowerCase()===name.toLowerCase())){toast('Kategori sudah ada.');return}state.categories.push({id:uid(),name,type,icon,system:false});save();closeModal();render();toast('Kategori ditambahkan.')}}
function exportBlob(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('File berhasil disiapkan.')}
function exportJSON(){const backup={...state,backupVersion:1,exportedAt:new Date().toISOString(),app:'ARUS Personal Finance'};exportBlob(`arus-backup-${todayISO()}.json`,JSON.stringify(backup,null,2),'application/json')}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(monthOnly=false){let txs=allTx();if(monthOnly){const m=monthISO();txs=allTx({from:monthStart(m),to:monthEnd(m)})}const heads=['id','tanggal','waktu','jenis','nominal_Rp','kategori','akun_atau_asal','akun_tujuan','merchant_atau_sumber','catatan'];const lines=[heads.map(csvCell).join(',')];for(const t of txs){lines.push([t.id,t.date,t.time,t.type,t.amount,t.type==='transfer'?'Transfer':catBy(t.categoryId)?.name, t.type==='transfer'?accountBy(t.fromAccountId)?.name:accountBy(t.accountId)?.name,t.type==='transfer'?accountBy(t.toAccountId)?.name:'',t.party,t.note].map(csvCell).join(','))}exportBlob(`arus-transaksi${monthOnly?'-'+monthISO():''}.csv`,'\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8')}
function importJSON(file){const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.accounts)||!Array.isArray(data.transactions)||!Array.isArray(data.categories))throw new Error('Format file bukan backup ARUS yang valid.');if(!confirm(`Pulihkan backup berisi ${data.accounts.length} akun dan ${data.transactions.length} transaksi? Data ARUS saat ini akan diganti. Sebaiknya ekspor backup saat ini terlebih dahulu.`))return;state={...initialState(),...data};if(!state.settings)state.settings={currency:'IDR',weekStart:1,hideAmounts:false,profileName:'Keuangan gue'};save();page='dashboard';render();toast('Backup berhasil dipulihkan.')}catch(e){alert('Gagal memulihkan backup: '+e.message)}};reader.readAsText(file)}
function wireView(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='add-tx')openTx();if(a==='add-account')openAccount();if(a==='add-budget')openBudget();if(a==='add-goal')openGoal();if(a==='add-category')openCategory();if(a==='profile'){showModal('Nama ruang keuangan','Ubah label personal aplikasi.',field('Nama',`<input class="field" id="profileName" value="${safe(state.settings.profileName||'Keuangan gue')}" maxlength="70" required>`));document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();state.settings.profileName=document.getElementById('profileName').value.trim();save();closeModal();toast('Preferensi disimpan.')}}}));document.querySelectorAll('#view [data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));document.querySelectorAll('[data-edit-tx]').forEach(b=>b.onclick=()=>openTx(state.transactions.find(t=>t.id===b.dataset.editTx)?.type,state.transactions.find(t=>t.id===b.dataset.editTx)));document.querySelectorAll('[data-delete-tx]').forEach(b=>b.onclick=()=>{const t=state.transactions.find(t=>t.id===b.dataset.deleteTx);if(t&&confirm(`Hapus transaksi ${txTitle(t)} senilai ${rupiah(t.amount)}? Saldo dan laporan akan dihitung ulang.`)){state.transactions=state.transactions.filter(x=>x.id!==t.id);save();render();toast('Transaksi dihapus.')}});document.querySelectorAll('[data-edit-account]').forEach(b=>b.onclick=()=>openAccount(accountBy(b.dataset.editAccount)));document.querySelectorAll('[data-transfer-account]').forEach(b=>b.onclick=()=>openTx('transfer',null,b.dataset.transferAccount));document.querySelectorAll('[data-delete-budget]').forEach(b=>b.onclick=()=>{const item=state.budgets.find(x=>x.id===b.dataset.deleteBudget);if(item&&confirm('Hapus anggaran ini?')){state.budgets=state.budgets.filter(x=>x.id!==item.id);save();render()}});document.querySelectorAll('[data-edit-budget]').forEach(b=>b.onclick=()=>openBudget(state.budgets.find(x=>x.id===b.dataset.editBudget)));document.querySelectorAll('[data-edit-goal]').forEach(b=>b.onclick=()=>openGoal(state.goals.find(x=>x.id===b.dataset.editGoal)));document.querySelectorAll('[data-delete-goal]').forEach(b=>b.onclick=()=>{if(confirm('Hapus target ini?')){state.goals=state.goals.filter(x=>x.id!==b.dataset.deleteGoal);save();render()}});document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{reportOffset=b.dataset.week==='0'?0:reportOffset+Number(b.dataset.week);render()});document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{if(b.dataset.export==='json')exportJSON();else exportCSV(b.dataset.export==='monthcsv')});const s=document.getElementById('txSearch');if(s)s.addEventListener('input',()=>{filters.search=s.value;const pos=s.selectionStart;const v=document.getElementById('view');const html=renderTransactions();v.innerHTML=html;wireView();const ns=document.getElementById('txSearch');ns.focus();ns.setSelectionRange(pos,pos)});const t=document.getElementById('txType');if(t)t.onchange=()=>{filters.type=t.value;render()};const a=document.getElementById('txAccount');if(a)a.onchange=()=>{filters.account=a.value;render()};const m=document.getElementById('txMonth');if(m)m.onchange=()=>{filters.month=m.value;render()};const bm=document.getElementById('budgetMonth');if(bm)bm.onchange=()=>{filters.month=bm.value;render()};const toggle=document.getElementById('toggleAmounts');if(toggle)toggle.onclick=()=>{state.settings.hideAmounts=!state.settings.hideAmounts;save();render()};const imp=document.getElementById('importBackup'),file=document.getElementById('backupFile');if(imp&&file)imp.onclick=()=>file.click();if(file)file.onchange=()=>{if(file.files?.[0])importJSON(file.files[0]);file.value=''};const cfgBtn=document.getElementById('saveCloudConfig');if(cfgBtn)cfgBtn.onclick=()=>saveCloudConfiguration();const signInBtn=document.getElementById('cloudSignIn');if(signInBtn)signInBtn.onclick=()=>cloudSignIn();const signOutBtn=document.getElementById('cloudSignOut');if(signOutBtn)signOutBtn.onclick=()=>cloudSignOut();const syncBtn=document.getElementById('cloudSyncNow');if(syncBtn)syncBtn.onclick=()=>{if(!cloudUser){toast('Login cloud terlebih dahulu.');return}reconcileCloud('manual')};const downBtn=document.getElementById('cloudDownload');if(downBtn)downBtn.onclick=()=>manualCloudDownload();const upBtn=document.getElementById('cloudUpload');if(upBtn)upBtn.onclick=()=>manualCloudUpload();const reset=document.getElementById('resetAll');if(reset)reset.onclick=()=>{if(confirm('PERINGATAN: semua data ARUS di browser ini akan dihapus. Ekspor backup terlebih dahulu. Lanjutkan?')){if(confirm('Konfirmasi terakhir: hapus akun, transaksi, anggaran, dan target?')){state=initialState();save();page='dashboard';render();toast('Data lokal direset.')}}}}
document.getElementById('quickAdd').onclick=()=>openTx();document.getElementById('mobileAdd').onclick=()=>openTx();document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;render()});document.getElementById('sideNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});document.getElementById('mobileNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});render();
startupCloud();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
